[package]
name = "maazdb-rs"
version = "2.0.0"
edition = "2024"
authors = ["Maaz Waheed"]
description = "Official Rust driver for MaazDB (Protocol v2.1)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
tokio-rustls = "0.24"
byteorder = "1.4"
anyhow = "1.0"
serde_json = "1.0"

# table coloring
colored = "2.0"
comfy-table = "7.0" 

# Cryptography for Protocol v2.1 Handshake
hmac = "0.12"
sha2 = "0.10"